[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-detection-project"
version = "0.1.0"
description = "QR detection and decoding workflow for autonomous detection experiments"
requires-python = ">=3.9"
authors = [{ name = "Project Team" }]
dependencies = [
  "numpy>=1.24.0",
  "opencv-python>=4.8.0",
  "ultralytics>=8.0.0",
  "zxing-cpp>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "vision*", "qr_decoder*", "qr_detection*"]
exclude = ["data*", "docs*", "labels*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
