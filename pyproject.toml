[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-detection-project"
version = "0.1.0"
description = "QR detection and decoding workflow for autonomous detection experiments"
requires-python = ">=3.9"
authors = [{ name = "Project Team" }]
dependencies = [
  "numpy>=1.24.0",
  "opencv-python>=4.8.0",
  "ultralytics>=8.0.0",
  "zxing-cpp>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "isort>=5.13.0",
  "flake8>=7.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pre-commit>=3.7.0",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
